  # ─── Reverse Proxy ───────────────────────────────────────────────────────────

  nginx-dashboard:
    container_name: nginx-dashboard
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    profiles: [core]
    # No depends_on — nginx serves 502 gracefully for any app that isn't running.
    # ML apps (09-12) are a separate profile so cannot be listed here.

  # ─── Cloudflare Tunnel ───────────────────────────────────────────────────────

  cloudflare-tunnel:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    profiles: [core]
